# 声明这是一个单包工作区。
# pnpm 会把本文件识别为 workspace 定义，缺少 packages 字段会直接报
# "packages field missing or empty"（CI 里 pnpm store path 就因此失败）。
packages:
  - '.'

# esbuild 是 vite 的依赖，必须执行其安装脚本才能拿到平台二进制；
# vue-demi 在本项目中未被直接依赖，关闭即可。
# allowBuilds 是 pnpm 10+ 的写法，需要在 CI 中使用 pnpm 10/11。
allowBuilds:
  esbuild: true
  vue-demi: false
