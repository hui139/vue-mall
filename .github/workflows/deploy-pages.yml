name: Deploy to GitHub Pages

# 每次推送到 main 自动构建并发布到 GitHub Pages。
# 也可以在 Actions 页面手动触发（workflow_dispatch）。
on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 的最小权限：读取仓库 + 写 Pages + 申请 id-token
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署，新的推送取消排队中的旧任务；
# 但不打断正在进行的发布，避免 Pages 处于半更新状态。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 必须与本地生成 lockfile / 使用 allowBuilds 的版本一致。
          # pnpm 9 不识别 allowBuilds，且 pnpm-workspace.yaml 缺 packages
          # 字段时会直接报 "packages field missing or empty"。
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # 仓库是普通项目仓库，Pages 地址为 https://<user>.github.io/<repo>/，
        # 因此资源前缀必须是 /<repo>/，与 vite.config.js 的 base 联动。
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
